<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Produk Responsif</title>
  </head>
  <body class="bg-canvas text-primary transition-colors duration-200">
    <header class="relative flex flex-wrap sm:justify-start sm:flex-nowrap w-full py-3 bg-surface border-b border-border transition-color duration-500">
      <nav class="max-w-340 w-full mx-auto px-4 sm:flex sm:items-center sm:justify-between">
        <div class="flex items-center justify-between">
          <a class="flex-none text-xl font-semibold text-primary focus:outline-hidden focus:opacity-80" href="/" aria-label="Brand">
            RealCommerce
          </a>
          <div class="sm:hidden">
            <button type="button" class="relative size-9 flex justify-center items-center gap-x-2 rounded-lg border border-border text-primary shadow-2xs hover:bg-hover focus:outline-hidden disabled:opacity-50 disabled:pointer-events-none" id="hs-navbar-example-collapse" aria-expanded="false" aria-controls="hs-navbar-example" aria-label="Toggle navigation">
              <span id="navbar-toggle-icon" class="shrink-0 size-4 flex items-center justify-center"></span>
              <span class="sr-only">Tampilkan Navigasi</span>
            </button>
          </div>
        </div>
        <div id="hs-navbar-example" class="hidden overflow-hidden transition-all duration-300 basis-full grow sm:flex sm:items-center sm:justify-end sm:gap-x-5" aria-labelledby="hs-navbar-example-collapse" role="region">
          <ul id="navbar-list" class="flex flex-col gap-5 mt-5 sm:flex-row sm:items-center sm:mt-0">
          </ul>
          <div class="flex items-center justify-between gap-x-3 mt-5 sm:mt-0 sm:ps-5 border-t border-border pt-4 sm:border-t-0 sm:pt-0 sm:border-s">
            <button id="theme-toggle-btn" type="button" class="size-8 flex justify-center items-center rounded-lg text-primary hover:bg-hover focus:outline-hidden" aria-label="Toggle theme">
              <span id="theme-toggle-icon" class="size-4 flex items-center justify-center"></span>
            </button>
            <div class="flex items-center gap-x-3">
              <span class="font-semibold text-primary" init-name></span>
              <img class="inline-block size-8 rounded-full ring-2 ring-ring" src="https://github.com/Realitaa.png" alt="Avatar">
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="mx-auto px-4 max-w-340 pt-10 pb-20">
      <h1 class="text-4xl font-bold text-primary">Selamat Datang, <span init-name></span></h1>
      <p class="text-lg text-muted mt-2">Mau belanja apa hari ini? Silahkan lihat katalog belanja kami.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
