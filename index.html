<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Produk Responsif</title>
  </head>
  <body>
    <header class="relative flex flex-wrap sm:justify-start sm:flex-nowrap w-full py-3 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <nav class="max-w-340 w-full mx-auto px-4 sm:flex sm:items-center sm:justify-between">
        <div class="flex items-center justify-between">
          <a class="flex-none text-xl font-semibold text-gray-800 dark:text-gray-200 focus:outline-hidden focus:opacity-80" href="/" aria-label="Brand">
            RealCommerce
          </a>
          <div class="sm:hidden">
            <button type="button" class="relative size-9 flex justify-center items-center gap-x-2 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-white shadow-2xs hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-hidden focus:bg-gray-50 dark:focus:bg-gray-700 disabled:opacity-50 disabled:pointer-events-none" id="hs-navbar-example-collapse" aria-expanded="false" aria-controls="hs-navbar-example" aria-label="Toggle navigation">
              <span id="navbar-toggle-icon" class="shrink-0 size-4 flex items-center justify-center"></span>
              <span class="sr-only">Tampilkan Navigasi</span>
            </button>
          </div>
        </div>
        <div id="hs-navbar-example" class="hidden overflow-hidden transition-all duration-300 basis-full grow sm:flex sm:items-center sm:justify-end sm:gap-x-5" aria-labelledby="hs-navbar-example-collapse" role="region">
          <ul id="navbar-list" class="flex flex-col gap-5 mt-5 sm:flex-row sm:items-center sm:mt-0">
          </ul>
          <div class="flex items-center justify-between gap-x-3 mt-5 sm:mt-0 sm:ps-5 border-t border-gray-200 dark:border-gray-700 pt-4 sm:border-t-0 sm:pt-0 sm:border-s">
            <button id="theme-toggle-btn" type="button" class="size-8 flex justify-center items-center rounded-lg text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none" aria-label="Toggle theme">
              <span id="theme-toggle-icon" class="size-4 flex items-center justify-center"></span>
            </button>
            <div class="flex items-center gap-x-3">
              <span class="font-semibold text-gray-800 dark:text-gray-200" id="init-name"></span>
              <img class="inline-block size-8 rounded-full ring-2 ring-gray-200 dark:ring-gray-700" src="https://github.com/Realitaa.png" alt="Avatar">
            </div>
          </div>
        </div>
      </nav>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
